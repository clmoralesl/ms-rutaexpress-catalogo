server.port=${SERVER_PORT:8082}
spring.application.name=ms-rutaexpress-catalogo

# ===== Conexion Oracle Cloud (Autonomous DB esquema USER_CATALOGO) =====
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@rutaexpressdb_high}
spring.datasource.username=${ORACLE_CATALOGO_USERNAME:USER_CATALOGO}
spring.datasource.password=${ORACLE_CATALOGO_PASSWORD:Flota.Servicios2026#Cat}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Ubicacion del Wallet Oracle
oracle.net.tns_admin=${ORACLE_WALLET_LOCATION:/opt/oracle/wallet}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_LOCATION:/opt/oracle/wallet}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
